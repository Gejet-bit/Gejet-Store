<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Alight Creative — Login</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.net.min.js"></script>
<style>
*{box-sizing:border-box}
:root{--c1:#6366f1;--c2:#ec4899}
html,body{margin:0;min-height:100%;font-family:'Plus Jakarta Sans',sans-serif;color:#fff;background:#050505}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;overflow:hidden}
#vanta{position:fixed;inset:0;z-index:-3}
.overlay{position:fixed;inset:0;z-index:-2;background:
 radial-gradient(circle at 15% 15%,rgba(99,102,241,.35),transparent 38%),
 radial-gradient(circle at 85% 85%,rgba(236,72,153,.28),transparent 40%),
 linear-gradient(to bottom,rgba(0,0,0,.38),#050505 92%)}
.glow{position:fixed;width:420px;height:420px;border-radius:50%;background:rgba(99,102,241,.18);filter:blur(100px);z-index:-1;pointer-events:none}
.card{width:min(520px,100%);padding:42px;border-radius:30px;background:rgba(255,255,255,.065);backdrop-filter:blur(35px);-webkit-backdrop-filter:blur(35px);border:1px solid rgba(255,255,255,.13);box-shadow:0 30px 100px rgba(0,0,0,.55),0 0 70px rgba(99,102,241,.13);animation:rise .7s ease both}
@keyframes rise{from{opacity:0;transform:translateY(20px) scale(.98)}to{opacity:1;transform:none}}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:30px}
.logo{width:48px;height:48px;border-radius:15px;display:grid;place-items:center;font-size:25px;background:linear-gradient(135deg,#6366f1,#ec4899);box-shadow:0 0 28px rgba(99,102,241,.5)}
.brand span{font-weight:800;font-size:18px}
h1{font-family:'Space Grotesk',sans-serif;font-size:clamp(34px,8vw,52px);line-height:1.03;margin:0 0 14px;text-shadow:0 0 35px rgba(99,102,241,.75)}
h1 em{font-style:normal;color:#818cf8}
.subtitle{margin:0 0 28px;color:#c9c9d4;font-size:14px;line-height:1.7}
.label{display:block;font-size:12px;font-weight:700;color:#d9d9e4;margin:0 0 9px}
.input-wrap{position:relative}
.input-wrap i{position:absolute;left:16px;top:50%;transform:translateY(-50%);font-size:20px;color:#9ca3af}
textarea{width:100%;height:142px;resize:vertical;min-height:110px;padding:16px 16px 16px 48px;border-radius:17px;border:1px solid rgba(255,255,255,.11);outline:none;background:rgba(255,255,255,.07);color:#fff;font-family:'Plus Jakarta Sans',sans-serif;font-size:13px;line-height:1.55;transition:.25s}
textarea::placeholder{color:#777b88}
textarea:focus{border-color:rgba(129,140,248,.8);box-shadow:0 0 0 4px rgba(99,102,241,.12),0 0 35px rgba(99,102,241,.16)}
button{position:relative;overflow:hidden;width:100%;border:0;border-radius:17px;padding:16px 20px;margin-top:13px;color:#fff;font-weight:800;font-size:14px;cursor:pointer;background:linear-gradient(135deg,#6366f1,#ec4899);box-shadow:0 10px 35px rgba(99,102,241,.3);transition:.25s}
button:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 14px 45px rgba(99,102,241,.45)}
button:disabled{opacity:.42;cursor:not-allowed;box-shadow:none}
button::after{content:"";position:absolute;inset:0;background:linear-gradient(120deg,transparent,rgba(255,255,255,.55),transparent);transform:translateX(-120%);transition:.6s}
button:hover:not(:disabled)::after{transform:translateX(120%)}
.status{display:flex;align-items:center;gap:8px;margin-top:14px;padding:11px 13px;border-radius:13px;background:rgba(255,255,255,.045);color:#9296a5;font-size:11px;line-height:1.4}
.status.ready{color:#86efac;background:rgba(34,197,94,.08)}
.footer{text-align:center;margin-top:24px;color:#666a78;font-size:10px}
@media(max-width:520px){body{padding:15px}.card{padding:29px 21px;border-radius:24px}.brand{margin-bottom:24px}h1{font-size:38px}}
</style>
</head>
<body>
<div id="vanta"></div><div class="overlay"></div><div class="glow"></div>

<main class="card">
  <div class="brand">
    <div class="logo"><i class="ri-sparkling-2-fill"></i></div>
    <span>Alight Creative</span>
  </div>

  <h1>Welcome<br><em>Back.</em></h1>
  <p class="subtitle">Tempel link login dari email kamu. Sistem akan otomatis merapikan link yang terpotong sebelum digunakan.</p>

  <label class="label" for="input">LOGIN LINK</label>
  <div class="input-wrap">
    <i class="ri-link"></i>
    <textarea id="input" placeholder="Tempel link email di sini..."></textarea>
  </div>

  <button id="login" disabled onclick="login()">
    <i class="ri-login-box-line"></i>&nbsp; Login ke Alight Creative
  </button>

  <div class="status" id="status">
    <i class="ri-information-line"></i><span>Belum ada link yang dimasukkan.</span>
  </div>
  <div class="footer">Secure redirect • Alight Creative</div>
</main>

<script>
let fixedUrl = "";

function repair(raw){
  let s = raw.replace(/\r\n/g,"\n").replace(/\r/g,"\n");
  s = s.replace(/=\n[ \t]*/g,"");
  s = s.replace(/=3D/gi,"=");
  s = s.replace(/[ \t]*\n[ \t]*/g,"");
  const href = s.match(/href\s*=\s*['"]([^'"]+)['"]/i);
  if(href) s = href[1];
  s = s.replace(/&amp;/gi,"&").trim();
  const match = s.match(/https?:\/\/[^\s<>"']+/i);
  return match ? match[0] : "";
}

function update(){
  fixedUrl = repair(document.getElementById("input").value);
  const btn = document.getElementById("login");
  const status = document.getElementById("status");
  const text = status.querySelector("span");
  btn.disabled = !fixedUrl;
  if(fixedUrl){
    status.classList.add("ready");
    status.querySelector("i").className="ri-checkbox-circle-fill";
    text.textContent="Link sudah diperbaiki dan siap digunakan.";
  }else{
    status.classList.remove("ready");
    status.querySelector("i").className="ri-information-line";
    text.textContent="Belum ada link yang valid.";
  }
}

function login(){ if(fixedUrl) window.location.href=fixedUrl; }

document.getElementById("input").addEventListener("input",update);
document.getElementById("input").addEventListener("paste",()=>setTimeout(update,0));

if(window.VANTA){
  VANTA.NET({
    el:"#vanta",color:0x6366f1,backgroundColor:0x050505,
    points:13,spacing:20,maxDistance:23,showDots:true
  });
}
</script>
</body>
</html>
