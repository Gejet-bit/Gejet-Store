<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Products – Gejet Store</title>

<script src="https://cdn.tailwindcss.com"></script>

<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700;800&family=Plus+Jakarta+Sans:wght@400;600&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
<link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.net.min.js"></script>

<style>
body{
  font-family:'Plus Jakarta Sans',sans-serif;
  background:#050505;
  color:#fff;
}
#vanta{position:fixed;inset:0;z-index:-2;}
.overlay{
  position:fixed;inset:0;
  background:
    radial-gradient(circle at top, rgba(99,102,241,.35), transparent 45%),
    radial-gradient(circle at bottom right, rgba(236,72,153,.25), transparent 45%),
    linear-gradient(to bottom, rgba(0,0,0,.5), #050505);
  z-index:-1;
}
.glass{
  background:rgba(255,255,255,.06);
  backdrop-filter:blur(40px);
  border:1px solid rgba(255,255,255,.12);
}
.tab{
  padding:14px 26px;
  border-radius:999px;
  font-weight:800;
  cursor:pointer;
  background:rgba(255,255,255,.08);
  transition:.3s;
}
.tab.active{
  background:linear-gradient(135deg,var(--c1),var(--c2));
  box-shadow:0 0 30px var(--c1);
}
.card{
  transition:.35s;
}
.card:hover{
  transform:translateY(-10px);
  box-shadow:0 0 80px rgba(99,102,241,.45);
}
.btn{
  position:relative;
  overflow:hidden;
}
.btn::after{
  content:'';
  position:absolute;
  inset:0;
  background:linear-gradient(120deg,transparent,rgba(255,255,255,.6),transparent);
  transform:translateX(-100%);
  transition:.6s;
}
.btn:hover::after{transform:translateX(100%);}

/* MODAL BORDER ANIMATION (ZANS PIW FEEL) */
.modal-border{
  position:relative;
}
.modal-border::before{
  content:'';
  position:absolute;
  inset:-2px;
  border-radius:1.5rem;
  background:linear-gradient(120deg,var(--c1),var(--c2),var(--c1));
  animation:borderMove 3s linear infinite;
  z-index:-1;
}
@keyframes borderMove{
  0%{filter:hue-rotate(0deg)}
  100%{filter:hue-rotate(360deg)}
}
</style>
</head>

<body>

<div id="vanta"></div>
<div class="overlay"></div>

<!-- HERO -->
<section class="max-w-7xl mx-auto px-6 py-28 text-center">
  <h1 class="text-6xl font-extrabold font-['Space_Grotesk'] mb-6"
      style="text-shadow:0 0 40px #6366f1">
    Digital <span class="text-indigo-400">Products</span>
  </h1>
  <p class="text-gray-300">Pilih kategori untuk melihat produk tersedia</p>
</section>

<!-- TABS -->
<section class="max-w-7xl mx-auto px-6 mb-16 flex gap-4 justify-center flex-wrap">
  <div class="tab active" style="--c1:#22c55e;--c2:#4ade80" onclick="filterCat('spotify',this)">Spotify</div>
  <div class="tab" style="--c1:#ef4444;--c2:#ec4899" onclick="filterCat('netflix',this)">Netflix</div>
  <div class="tab" style="--c1:#f87171;--c2:#fb7185" onclick="filterCat('youtube',this)">YouTube</div>
</section>

<!-- PRODUCTS -->
<section class="max-w-7xl mx-auto px-6 pb-28">
  <div id="list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-10"></div>
</section>

<!-- MODAL -->
<div id="modal" class="fixed inset-0 hidden items-center justify-center z-50">
  <div class="absolute inset-0 bg-black/70 backdrop-blur-sm" onclick="closeModal()"></div>

  <div id="modalCard"
       class="relative glass modal-border rounded-3xl p-10 w-[90%] max-w-md z-10">
    <h3 class="text-2xl font-extrabold mb-6 font-['Space_Grotesk']">
      Konfirmasi <span class="text-indigo-400">Pembelian</span>
    </h3>

    <p id="mProduct" class="text-lg font-bold"></p>
    <p id="mPrice" class="text-2xl font-extrabold mb-6"></p>

    <input id="mWa" placeholder="Nomor WhatsApp"
      class="w-full mb-3 bg-white/10 border border-white/10 rounded-xl px-4 py-3">

    <textarea id="mNote" placeholder="Keterangan (opsional)"
      class="w-full mb-6 bg-white/10 border border-white/10 rounded-xl px-4 py-3"></textarea>

    <div class="flex gap-3">
      <button onclick="confirmBuy()"
        class="flex-1 btn py-3 rounded-xl font-bold bg-gradient-to-r from-indigo-500 to-pink-500">
        Lanjut Beli
      </button>
      <button onclick="closeModal()"
        class="px-5 py-3 rounded-xl bg-white/10 hover:bg-white/20">
        Batal
      </button>
    </div>
  </div>
</div>

<script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
<script>
AOS.init({once:true,duration:900,offset:120});

VANTA.NET({
  el:"#vanta",
  color:0x6366f1,
  backgroundColor:0x050505,
  points:14,
  spacing:18
});

const products = [
  {cat:'spotify', name:'Spotify 1 Bulan', price:'Rp 15.000', icon:'ri-spotify-fill', c:'#22c55e', g:['#22c55e','#4ade80']},
  {cat:'spotify', name:'Spotify 3 Bulan', price:'Rp 40.000', icon:'ri-spotify-fill', c:'#22c55e', g:['#22c55e','#4ade80']},
  {cat:'netflix', name:'Netflix 1 Bulan', price:'Rp 25.000', icon:'ri-netflix-fill', c:'#ef4444', g:['#ef4444','#ec4899']},
  {cat:'youtube', name:'YouTube 1 Bulan', price:'Rp 10.000', icon:'ri-youtube-fill', c:'#f87171', g:['#f87171','#fb7185']}
];

let current = {};

function render(cat){
  list.innerHTML='';
  products.filter(p=>p.cat===cat).forEach((p,i)=>{
    list.innerHTML+=`
    <div class="glass card rounded-3xl p-10" data-aos="fade-up" data-aos-delay="${i*120}">
      <i class="${p.icon} text-6xl mb-6" style="color:${p.c}"></i>
      <h3 class="text-2xl font-bold mb-2">${p.name}</h3>
      <p class="text-4xl font-extrabold mb-10" style="color:${p.c}">${p.price}</p>
      <button onclick="openModal('${p.name}','${p.price}','${p.c}','${p.g[0]}','${p.g[1]}')"
        class="btn w-full py-4 rounded-2xl font-bold"
        style="background:linear-gradient(135deg,${p.g[0]},${p.g[1]})">
        Beli Sekarang
      </button>
    </div>`;
  });
}

function filterCat(cat,el){
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  el.classList.add('active');
  render(cat);
}

function openModal(name,price,color,c1,c2){
  current={name,price};
  mProduct.innerText=name;
  mPrice.innerText=price;
  mPrice.style.color=color;
  modalCard.style.setProperty('--c1',c1);
  modalCard.style.setProperty('--c2',c2);
  modal.classList.remove('hidden');
  modal.classList.add('flex');
}

function closeModal(){
  modal.classList.add('hidden');
  modal.classList.remove('flex');
}

function confirmBuy(){
  if(!mWa.value) return alert('Nomor WhatsApp wajib diisi');

  const text =
`Halo admin, saya mau beli:
Produk: ${current.name}
Harga: ${current.price}
WA: ${mWa.value}
Catatan: ${mNote.value || '-'}`;

  window.open(
    'https://wa.me/628123456789?text='+encodeURIComponent(text),
    '_blank'
  );
  closeModal();
}

render('spotify');
</script>

</body>
</html>
